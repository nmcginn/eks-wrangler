name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning: lint drift is much easier to stop than to clean up.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Check docs build
        run: cargo doc --locked --no-deps --all-features

      # The release workflow only runs on master, so a broken check in
      # scripts/ would otherwise first show up after the merge that broke it.
      - name: Test the release scripts
        run: make script-test

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked so a PR that forgets to commit Cargo.lock fails here rather
      # than silently resolving different dependency versions than the author had.
      - name: Test
        run: cargo test --locked --all-features

      - name: Smoke-test the binary
        shell: bash
        run: |
          cargo build --locked
          ./target/debug/eks --version
          ./target/debug/eks --help

          # The tool must degrade gracefully when there is no cluster config at
          # all — that is a normal first-run state, not an error to panic on.
          export KUBECONFIG="${RUNNER_TEMP}/definitely-not-here.yaml"
          if ./target/debug/eks contexts; then
            echo "expected a failure exit code with no kubeconfig" >&2
            exit 1
          fi

  bench:
    name: Startup benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Criterion compares each run against whatever it finds under
      # target/criterion and prints a regression or improvement — but never
      # fails the build over it, which is the whole point: this job reports,
      # it does not gate. That history means nothing unless it survives
      # between runs, which Swatinem/rust-cache above does not promise for a
      # directory that is not a compiler artifact. A cache keyed by branch,
      # falling back to master's, is what makes a pull request's numbers read
      # as "versus master" instead of "versus nothing."
      - name: Restore benchmark history
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            criterion-${{ runner.os }}-${{ github.ref_name }}-
            criterion-${{ runner.os }}-master-

      - name: Run benchmarks
        run: |
          {
            echo '### Startup benchmarks'
            echo
            echo '```'
            cargo bench --locked --bench startup
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Best-effort: a re-run on the same commit hits an already-occupied key,
      # which is not a reason to fail a job whose whole purpose is reporting.
      - name: Save benchmark history
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
