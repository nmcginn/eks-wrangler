name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning: lint drift is much easier to stop than to clean up.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Check docs build
        run: cargo doc --locked --no-deps --all-features

      # The release workflow only runs on master, and the bench job reports
      # rather than gates, so a broken script in scripts/ would otherwise
      # first show up after the merge that broke it.
      - name: Test the scripts
        run: make script-test

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked so a PR that forgets to commit Cargo.lock fails here rather
      # than silently resolving different dependency versions than the author had.
      - name: Test
        run: cargo test --locked --all-features

      - name: Smoke-test the binary
        shell: bash
        run: |
          cargo build --locked
          ./target/debug/eks --version
          ./target/debug/eks --help

          # The tool must degrade gracefully when there is no cluster config at
          # all — that is a normal first-run state, not an error to panic on.
          export KUBECONFIG="${RUNNER_TEMP}/definitely-not-here.yaml"
          if ./target/debug/eks contexts; then
            echo "expected a failure exit code with no kubeconfig" >&2
            exit 1
          fi

  # Builds every target and runs the tests on the rust-version Cargo.toml
  # declares, so the MSRV is proven on every PR rather than claimed
  # (decision 118). The other jobs all run the latest stable, which would
  # never notice a newer API or a dependency bump that quietly raised it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from the manifest, by the runner's preinstalled cargo, rather
      # than written down again here: raising rust-version is then a
      # one-line change this job follows by itself.
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(scripts/msrv.sh --print)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and test on the MSRV
        run: scripts/msrv.sh

  # Advisories, licences, bans, and sources, per deny.toml (decision 117).
  # Its own job so a new advisory against an unchanged Cargo.lock — which can
  # land on any PR, whatever it touches — reads as exactly that, not as the
  # PR's own lint or test failure.
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned, like hyperfine below and cargo-zigbuild in release.yml, so a
      # new cargo-deny release (and whatever it newly checks) never turns up
      # in an unrelated merge; rust-cache keeps the installed binary. The
      # version is repeated in scripts/tests/deny-policy.sh's install hint.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # Checks the real tree, then proves the policy rejects what it claims
      # to against fixture crates.
      - name: Check dependencies
        run: make deny

  bench:
    name: Startup benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Criterion compares each run against whatever it finds under
      # target/criterion and prints a regression or improvement — but never
      # fails the build over it, which is the whole point: this job reports,
      # it does not gate. That history means nothing unless it survives
      # between runs, which Swatinem/rust-cache above does not promise for a
      # directory that is not a compiler artifact. A cache keyed by branch,
      # falling back to master's, is what makes a pull request's numbers read
      # as "versus master" instead of "versus nothing."
      - name: Restore benchmark history
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            criterion-${{ runner.os }}-${{ github.ref_name }}-
            criterion-${{ runner.os }}-master-

      - name: Run benchmarks
        run: |
          {
            echo '### Startup benchmarks'
            echo
            echo '```'
            cargo bench --locked --bench startup
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The criterion step above never execs the binary, so it cannot see
      # exec, dynamic linking, or the binary's own startup — most of what a
      # user waits on. hyperfine times that (decision 112). Pinned, like
      # cargo-zigbuild in release.yml, so a new hyperfine release never turns
      # up in an unrelated merge; rust-cache keeps the installed binary.
      - name: Install hyperfine
        run: cargo install --locked hyperfine@1.20.0

      # Reported, never gated: the script fails only if a timed command exits
      # non-zero, which is a broken binary, not a slow one.
      - name: Time process startup
        run: |
          cargo build --locked --release
          scripts/bench-startup.sh target/release/eks | tee -a "$GITHUB_STEP_SUMMARY"

      # Best-effort: a re-run on the same commit hits an already-occupied key,
      # which is not a reason to fail a job whose whole purpose is reporting.
      - name: Save benchmark history
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
