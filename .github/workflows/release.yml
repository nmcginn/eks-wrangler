name: Release build

# Every merge to master produces optimised binaries, so a broken release build
# is caught the day it lands rather than at tag time. Tagging `v*` additionally
# publishes a GitHub Release from those same artifacts.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
            # The oldest glibc this binary starts on. Linked against it by
            # `cargo zigbuild`, checked back out of the binary afterwards, and
            # proven by starting the binary on Amazon Linux 2023. 2.17 is
            # Rust's own minimum for this target, so nothing is gained by
            # declaring anything newer (decision 109).
            glibc: "2.17"
            platform: linux/amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            # Cross-compiled from an arm64 runner; running it needs Rosetta,
            # which may not be present, so skip the smoke test here.
            native: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # The one binary that runs on any Linux, whatever its glibc or
            # however bare its container image — so it is checked to be
            # static rather than trusted to be. An x86_64 runner executes it
            # directly, so it is smoke-tested like any native build.
            native: true
            static: true
            # `ring`'s C code is compiled for musl by `musl-gcc`, which `cc`
            # finds on its own once this package puts it on the PATH.
            apt: musl-tools
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # Cross-compiled on x86_64 by `cargo zigbuild`, whose zig is both
            # the linker and, for `ring`, the C compiler — so no aarch64 gcc
            # is installed. Run under user-mode QEMU so it gets the same smoke
            # test and completions as every native leg rather than shipping
            # untested and without them; `libc6-arm64-cross` is the sysroot
            # `-L` points the emulator's dynamic loader at.
            native: false
            emulator: qemu-aarch64 -L /usr/aarch64-linux-gnu
            apt: libc6-arm64-cross qemu-user
            glibc: "2.17"
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install the target's C toolchain
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A `-gnu` binary needs at least the glibc it was linked against, and
      # the runner's is whatever `ubuntu-latest` ships (2.39 on 24.04). zig
      # carries stub libraries for every glibc version, so `cargo zigbuild`
      # with a `.2.17` suffix on the target links against 2.17's symbol
      # versions instead. Both are pinned: a zig release can change what its
      # stubs export, and the floor check below is what would catch it, but
      # it should not be a surprise on an unrelated merge.
      - name: Install zig
        if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: cargo install --locked cargo-zigbuild@0.23.4

      # `cargo zigbuild` writes to target/<triple>/release/ without the
      # suffix, so every step after this one reads the same path either way.
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Verify the binary's glibc floor
        if: matrix.glibc
        run: scripts/verify-glibc-floor.sh target/${{ matrix.target }}/release/eks ${{ matrix.glibc }}

      # The floor check reads what the binary *asks* for; this starts it
      # where it matters. Amazon Linux 2023 (glibc 2.34) is where an EKS tool
      # on Graviton gets run, and the one older-glibc host the roadmap names.
      # The aarch64 image runs under QEMU through binfmt, registered below.
      # The image comes from Amazon's own registry rather than Docker Hub,
      # whose anonymous pull limit is shared across a runner's tenants.
      - name: Register QEMU for foreign-architecture containers
        if: matrix.glibc && matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Start the binary on Amazon Linux 2023
        if: matrix.glibc
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --volume "$PWD/target/${{ matrix.target }}/release:/opt/eks:ro" \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            sh -c 'rpm -q glibc && /opt/eks/eks --version && /opt/eks/eks --help > /dev/null'

      - name: Verify the binary is static
        if: matrix.static
        run: scripts/verify-static.sh target/${{ matrix.target }}/release/eks

      # `matrix.emulator` is empty on every leg that has none, so on a native
      # build this runs the binary directly.
      - name: Smoke-test the binary
        if: matrix.native || matrix.emulator
        run: |
          ${{ matrix.emulator }} ./target/${{ matrix.target }}/release/eks --version
          ${{ matrix.emulator }} ./target/${{ matrix.target }}/release/eks --help

      # Completions and the man page are rendered straight from the `Cli`
      # definition, so they read the same regardless of which target they are
      # packaged for — but only a binary the runner can execute can render
      # them, natively or under `matrix.emulator`. That is exactly the
      # condition the smoke test above already answers; the one leg that can
      # do neither (x86_64-apple-darwin, built on an arm64 runner) ships
      # without them rather than needing Rosetta just to generate two text
      # files.
      - name: Generate completions and man page
        if: matrix.native || matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          run="${{ matrix.emulator }} target/${{ matrix.target }}/release/eks"
          mkdir -p assets/completions
          $run completions bash > assets/completions/eks.bash
          $run completions zsh > assets/completions/_eks
          $run completions fish > assets/completions/eks.fish
          $run man > assets/eks.1

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="eks-${{ matrix.target }}"
          mkdir -p "dist/${staging}"
          cp "target/${{ matrix.target }}/release/eks" "dist/${staging}/"
          cp README.md LICENSE "dist/${staging}/"
          if [ -d assets ]; then
            cp -r assets/. "dist/${staging}/"
          fi
          tar -czf "dist/${staging}.tar.gz" -C dist "${staging}"
          # Checksums travel with the artifact so scripts/install.sh and the
          # Homebrew formula can verify them. Written from inside dist/ so the
          # file names the tarball alone, and `shasum -c` works on a user's
          # download without editing the path.
          (cd dist && shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eks-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Formula/eks.rb is tapped straight from master (decision 113), so a release
  # is not installable through Homebrew until the formula names its tarballs
  # and digests. Those exist only once the build above has run, so the
  # formula is rendered here, from the checksums just published, and
  # committed back (decision 119). It is also attached to the release, so a
  # push that fails still leaves the rendered file one download away.
  formula:
    name: Update the Homebrew formula
    needs: publish
    # A pre-release tag (v0.3.0-rc.1) is published but not put in front of
    # everyone who runs `brew upgrade`.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The formula's `test do` block runs `eks --version` and expects the
      # formula's version in it, so a tag that disagrees with Cargo.toml
      # would publish a formula whose own test fails. The static build runs
      # on this runner, so ask it rather than trusting the tag.
      - name: Check the tag matches the binary's version
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/eks-x86_64-unknown-linux-musl.tar.gz -C dist
          reported="$(dist/eks-x86_64-unknown-linux-musl/eks --version)"
          if [ "$reported" != "eks ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME was built from a binary reporting '$reported' — set version in Cargo.toml to ${GITHUB_REF_NAME#v} and tag again"
            exit 1
          fi

      - name: Render Formula/eks.rb
        run: |
          mkdir -p Formula
          scripts/render-formula.sh "$GITHUB_REF_NAME" dist > Formula/eks.rb
          ruby -c Formula/eks.rb

      - name: Attach the formula to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Formula/eks.rb --clobber --repo "$GITHUB_REPOSITORY"

      - name: Commit the formula to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/eks.rb
          if git diff --cached --quiet; then
            echo "Formula/eks.rb already names $GITHUB_REF_NAME"
            exit 0
          fi
          git commit --message "Update the Homebrew formula to $GITHUB_REF_NAME"
          if ! git push origin HEAD:master; then
            {
              echo "### Homebrew formula not committed"
              echo
              echo "Pushing to master was refused. Until Formula/eks.rb is committed,"
              echo "\`brew install\` keeps installing the previous release. The rendered file"
              echo "is attached to the $GITHUB_REF_NAME release; commit it as Formula/eks.rb."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::could not push Formula/eks.rb to master — commit the eks.rb attached to the $GITHUB_REF_NAME release by hand"
            exit 1
          fi
